<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Synapse</title>
    <style>
      body { font-family: system-ui, sans-serif; width: 280px; margin: 0; padding: 8px; }
      body.wide { width: 480px; }
      .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
      .header h1 { font-size: 14px; margin: 0; flex: 1; }
      .header button { border: none; background: none; cursor: pointer; font-size: 14px; }
      .module-list { list-style: none; margin: 0; padding: 0; }
      .module-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; gap: 8px; }
      .module-row.disabled { opacity: 0.5; }
      .module-label-link { cursor: pointer; text-decoration: underline dotted; }
      .module-gear { border: none; background: none; cursor: pointer; font-size: 13px; }
      .reason { font-size: 11px; color: #b00; }
      .row-actions { display: flex; align-items: center; gap: 6px; }
      .banner { font-size: 11px; color: #7a5b00; background: #fff6dd; border: 1px solid #f0dca0; border-radius: 4px; padding: 6px 8px; margin-bottom: 8px; }
      .item-form, .action-result-form { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
      .item-form label { display: flex; flex-direction: column; gap: 2px; }
      .item-form menu, .action-result-form menu { display: flex; justify-content: flex-end; gap: 6px; margin: 0; padding: 0; }
      .action-result-form textarea { width: 100%; max-height: 300px; box-sizing: border-box; font-family: monospace; font-size: 11px; }
      .action-result-form.is-error p { color: #b00; }
      .management-filter { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 4px 6px; }
      .management-empty { font-size: 12px; color: #666; text-align: center; }
      .management-table { width: 100%; border-collapse: collapse; font-size: 11px; }
      .management-table th, .management-table td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #eee; }
      .management-table button { border: none; background: none; cursor: pointer; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
